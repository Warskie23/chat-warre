name: Build llama-server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Build llama.cpp from source (AVX2 CPU, no OpenSSL)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cd llama.cpp
          cmake -B build -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_CURL=OFF
          cmake --build build --config Release --target llama-server -j 4

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          $srv = Get-ChildItem llama.cpp\build -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $srv) { throw "llama-server.exe was not built." }
          Copy-Item "$($srv.DirectoryName)\*.exe" out\
          Copy-Item "$($srv.DirectoryName)\*.dll" out\ -ErrorAction SilentlyContinue
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: llama-server-only
          path: out
