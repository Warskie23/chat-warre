      - name: Download llama.cpp (CPU build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "actions" }
          $releases = Invoke-RestMethod "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=30" -Headers $headers

          $patterns = @('win-cpu-x64', 'win-avx2-x64', 'win-noavx-x64')
          $asset = $null
          foreach ($rel in $releases) {
            foreach ($p in $patterns) {
              $asset = $rel.assets | Where-Object { $_.name -like "*$p*.zip" -and $_.name -notlike "*cudart*" } | Select-Object -First 1
              if ($asset) { break }
            }
            if ($asset) { Write-Host "Release: $($rel.tag_name)"; break }
          }

          if (-not $asset) {
            $releases | Select-Object -First 5 | ForEach-Object {
              Write-Host "== $($_.tag_name)"
              $_.assets | ForEach-Object { Write-Host $_.name }
            }
            throw "No matching Windows CPU asset found. See the list above."
          }

          Write-Host "Using: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile llama.zip
          Expand-Archive llama.zip -DestinationPath llama
